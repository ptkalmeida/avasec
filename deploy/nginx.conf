# Configuração de referência do Nginx para o AVASEC em produção (VPS).
# Copie para /etc/nginx/sites-available/avasec e crie um link em sites-enabled:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/avasec
#   sudo ln -s /etc/nginx/sites-available/avasec /etc/nginx/sites-enabled/avasec
#   sudo nginx -t && sudo systemctl reload nginx
# Depois rode `sudo certbot --nginx -d seu-dominio.com.br` para emitir o HTTPS (Let's Encrypt).

server {
    listen 80;
    server_name seu-dominio.com.br;

    # Uploads de PDFs/imagens podem ser maiores que o padrão de 1MB do Nginx.
    client_max_body_size 20M;

    # Arquivos enviados via /api/upload (multer) — servidos direto pelo Nginx, sem passar pelo Node.
    location /uploads/ {
        alias /var/www/avasec/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Build estático do Vite (gerado por `npm run build` em dist/).
    location / {
        root /var/www/avasec/dist;
        try_files $uri $uri/ @backend;
    }

    # API e fallback de SPA são atendidos pelo processo Node (PM2) na porta 3000.
    location @backend {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
