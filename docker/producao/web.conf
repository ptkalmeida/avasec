# Bloco `server` do container `web` (HML e PRD).
#
# O de espelho local é docker/nginx/espelho.conf; os `location` e os cabeçalhos são os MESMOS
# arquivos dos dois lados. Aqui só mora o que é do ambiente: a raiz e a ausência de TLS —
# o certificado e o HSTS ficam no ponto de entrada da TI, na frente deste container.
server {
    listen 80;
    server_name _;

    root /var/www/avasec/backend-laravel/public;
    index index.php;

    client_max_body_size 20m;

    include /etc/nginx/avasec-cabecalhos.conf;
    include /etc/nginx/avasec-locations.conf;
}
