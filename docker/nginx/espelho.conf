# Espelho local de produção — bloco `server` do AVASEC.
#
# Só o que é legitimamente diferente de produção mora aqui: porta, nome, e a
# ausência de TLS (o certificado é do domínio real). Os blocos `location` vêm do
# arquivo compartilhado, que é literalmente o mesmo que vai para o servidor.
#
# Por que este espelho existe: no desenvolvimento o Laravel roda por `artisan
# serve`, e a configuração de produção — Nginx, PHP-FPM, cabeçalhos, /uploads —
# não é executada ali. Era configuração escrita e nunca rodada. Aqui ela roda.

server {
    listen 80;
    server_name localhost;

    # Mesmos caminhos de produção, de propósito: o repositório é montado em
    # /var/www/avasec no container. Caminho diferente esconderia erro de caminho.
    root /var/www/avasec/backend-laravel/public;
    index index.php;

    client_max_body_size 20m;

    # Os mesmos cabeçalhos de produção, do arquivo compartilhado (menos o HSTS, que exige
    # HTTPS e, em localhost, prenderia o navegador a https:// para todo projeto na porta 80).
    include /etc/nginx/avasec-cabecalhos.conf;

    include /etc/nginx/avasec-locations.conf;
}
