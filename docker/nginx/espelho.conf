# Espelho local de produção — bloco `server` do AVASEC.
#
# Só o que é legitimamente diferente de produção mora aqui: porta, nome, e a
# ausência de TLS (o certificado é do domínio real). Os blocos `location` vêm do
# arquivo compartilhado, que é literalmente o mesmo que vai para o servidor.
#
# Por que este espelho existe: no fluxo de desenvolvimento normal quem atende o
# navegador é o Vite (:5173), e o Laravel só recebe o que o proxy encaminha.
# A configuração de produção — raiz no Laravel, /assets saindo do dist,
# index.html servido pelo PHP — simplesmente NÃO é executada ali. Era
# configuração escrita e nunca rodada. Aqui ela roda.

server {
    listen 80;
    server_name localhost;

    # Mesmos caminhos de produção, de propósito: o repositório é montado em
    # /var/www/avasec no container. Caminho diferente esconderia erro de caminho.
    root /var/www/avasec/backend-laravel/public;
    index index.php;

    set $raiz_dist /var/www/avasec/dist;

    client_max_body_size 20m;

    # Mesmos cabeçalhos de produção, menos o HSTS (que exige HTTPS e, em
    # localhost, prenderia o navegador a https:// para todo projeto na porta 80).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; font-src 'self' data:; object-src 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    include /etc/nginx/avasec-locations.conf;
}
