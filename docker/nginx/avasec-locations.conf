# Roteamento do AVASEC — a parte que vale IGUAL em produção e no espelho local.
#
# Este arquivo é a FONTE ÚNICA dos blocos `location`. O espelho local
# (docker/nginx/espelho.conf) e o servidor de produção (DEPLOY_LARAVEL.md) o
# incluem; nenhum dos dois copia o conteúdo. Era essa cópia que eu queria
# evitar: a configuração de produção foi escrita sem nunca ter sido executada,
# e uma segunda versão "parecida" no Docker provaria a versão errada.
#
# O que NÃO está aqui, por ser legitimamente diferente entre os dois:
# `listen`, `server_name`, certificado TLS, HSTS e `root`.
#
# Depende de uma coisa definida pelo ambiente que inclui este arquivo:
#   /etc/nginx/avasec-upstream.conf -> uma linha só, com o `fastcgi_pass`
#
# Desde a fase M7 (ADR 020) não há mais `dist/` nem `/assets/`: os assets das telas
# Blade saem de `public/build` (gerado por `npm run build`), que o `location /` abaixo
# serve como qualquer arquivo estático de `public/`.
#
# O upstream é arquivo e não variável de propósito. A primeira versão usava
# `fastcgi_pass $php_upstream;`, e um nome de host em VARIÁVEL faz o Nginx
# resolvê-lo em tempo de requisição, o que exige a diretiva `resolver`: o
# espelho subiu e respondeu 502 em tudo, com "no resolver defined to resolve
# php". Valor literal é resolvido na carga da configuração e não tem esse
# problema — e o destino é legitimamente diferente entre socket e TCP.

# Arquivos públicos enviados pelos usuários (materiais, biblioteca).
#
# IMPORTANTE: um bloco `location` com `add_header` próprio DESCARTA todos os
# add_header herdados do server (inclusive os `always`). Como este conteúdo é
# controlado por terceiros e servido na MESMA origem da aplicação (onde vive o
# cookie de sessão), os cabeçalhos de segurança precisam ser repetidos aqui —
# sem o `nosniff`, um arquivo malicioso viraria XSS same-origin. Servir como
# attachment reduz ainda mais o risco de renderização no navegador.
location /uploads/ {
    alias /var/www/avasec/uploads/public/;
    add_header Content-Security-Policy "default-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Disposition "attachment" always;
}

# Tudo o mais vai para o Laravel: API, saúde, status e todas as telas (Blade).
# Não há um bloco `location` por área: a tabela de rotas do Laravel é quem
# decide, e ela está versionada no repositório. O que não casa é 404 (ADR 020).
location / {
    try_files $uri /index.php?$query_string;
}

location ~ \.php$ {
    include /etc/nginx/avasec-upstream.conf;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_read_timeout 60s;
}

# Nada de servir arquivo oculto (.env, .git) nem os fontes do backend.
location ~ /\. {
    deny all;
}
