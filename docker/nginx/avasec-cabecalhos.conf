# Cabeçalhos de segurança do AVASEC — iguais em produção, homologação e no espelho local.
#
# Fonte única, como o `avasec-locations.conf`: o espelho (espelho.conf) e o servidor
# (DEPLOY_LARAVEL.md) o incluem no bloco `server`, e nenhum dos dois copia o conteúdo.
# Antes, a política vivia colada em dois arquivos, e só um deles era executado.
#
# O que ficou de fora, por ser do ambiente: `Strict-Transport-Security` (exige HTTPS; em
# localhost prenderia o navegador a https:// para todo projeto na porta 80).
#
# CSP — por que cada exceção existe (descoberto ao rodar os e2e contra o Nginx, 26/10/2026):
#
# * `script-src 'self' 'unsafe-eval'`: o Alpine.js, que o Livewire 4 embute, compila cada
#   `x-data`/`x-show`/`:class` com `new Function`. Sem 'unsafe-eval' o menu lateral, as
#   perguntas da Ajuda e a prévia do editor simplesmente não funcionam em HML, e funcionam
#   em desenvolvimento — porque lá não há Nginx. NÃO há 'unsafe-inline': script embutido na
#   página continua bloqueado, que é a defesa que importa contra XSS. Tirar o 'unsafe-eval'
#   exige trocar o Alpine pelo build CSP (`@alpinejs/csp`) e reescrever as expressões das
#   21 telas em `Alpine.data` — fica como melhoria, e a troca é só nesta linha.
# * `fonts.googleapis.com` (estilo) e `fonts.gstatic.com` (fonte): o layout carrega Inter e
#   Playfair Display do Google Fonts. Bloqueados, a tela cai em fonte do sistema. Hospedar as
#   fontes no próprio servidor tira essa dependência (e o envio do IP do aluno ao Google).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; object-src 'none'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
# `no-referrer` quebrava o player do YouTube (ele exige o referenciador). Mantém a origem
# para fora do site e o endereço completo só dentro dele.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
